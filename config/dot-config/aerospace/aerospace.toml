# ── AeroSpace v0.21+ config ──
# i3 refugee with stacked (accordion) as default

config-version = 2

start-at-login = false
auto-reload-config = true

after-startup-command = []

# ── Normalization (i3-like tree behavior) ──
enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

# ── Layout defaults ──
# 'accordion' = i3 stacked layout. Shows the focused window full-size
# with a peek of the others behind it (controlled by accordion-padding).
default-root-container-layout = 'accordion'
default-root-container-orientation = 'auto'
accordion-padding = 40

# ── Gaps ──
gaps.inner.horizontal = 4
gaps.inner.vertical    = 4
gaps.outer.left        = 6
gaps.outer.bottom      = 6
gaps.outer.top         = 6
gaps.outer.right       = 6

# ── Focus ──
focus-follows-mouse.enabled = false

# ── macOS stuff ──
automatically-unhide-macos-hidden-apps = false

on-focused-monitor-changed = ['move-mouse monitor-lazy-center']
on-mode-changed = []

# ── Workspaces ──
persistent-workspaces = [
    "1", "2", "3", "4", "5", "6", "7", "8", "9",
    "A", "B", "C", "D", "E", "F", "G", "I", "M", "N", "O", "P", "Q",
    "R", "S", "T", "U", "V", "W", "X", "Y", "Z",
]

key-mapping.preset = 'qwerty'

# ─────────────────────────────────────────────────────────────────
# MAIN BINDING MODE
# ─────────────────────────────────────────────────────────────────
[mode.main.binding]

    # ── Launch terminal (iTerm2) ──
    alt-enter = '''exec-and-forget osascript -e '
        tell application "iTerm2"
            create window with default profile
            activate
        end tell' '''

    # ── Layout cycling (like i3 mod-space) ──
    # Cycle: tiles → accordion (stacked) → floating → back to tiles
    alt-space = 'layout tiles accordion floating'

    # Or manually toggle specific layouts
    alt-comma = 'layout accordion horizontal vertical'
    alt-slash = 'layout tiles horizontal vertical'

    # ── Focus (vim-style / i3 arrows) ──
    alt-h = 'focus left'
    alt-j = 'focus down'
    alt-k = 'focus up'
    alt-l = 'focus right'

    # ── Move windows ──
    alt-shift-h = 'move left'
    alt-shift-j = 'move down'
    alt-shift-k = 'move up'
    alt-shift-l = 'move right'

    # ── Resize ──
    alt-minus     = 'resize smart -50'
    alt-equal     = 'resize smart +50'

    # ── Full-screen / maximize ──
    alt-shift-f = 'fullscreen'

    # ── Workspace switching ──
    alt-1 = 'workspace 1'
    alt-2 = 'workspace 2'
    alt-3 = 'workspace 3'
    alt-4 = 'workspace 4'
    alt-5 = 'workspace 5'
    alt-6 = 'workspace 6'
    alt-7 = 'workspace 7'
    alt-8 = 'workspace 8'
    alt-9 = 'workspace 9'
    alt-a = 'workspace A'
    alt-b = 'workspace B'
    alt-c = 'workspace C'
    alt-d = 'workspace D'
    alt-e = 'workspace E'
    alt-f = 'workspace F'
    alt-g = 'workspace G'
    alt-i = 'workspace I'
    alt-m = 'workspace M'
    alt-n = 'workspace N'
    alt-o = 'workspace O'
    alt-p = 'workspace P'
    alt-q = 'workspace Q'
    alt-r = 'workspace R'
    alt-s = 'workspace S'
    alt-t = 'workspace T'
    alt-u = 'workspace U'
    alt-v = 'workspace V'
    alt-w = 'workspace W'
    alt-x = 'workspace X'
    alt-y = 'workspace Y'
    alt-z = 'workspace Z'

    # ── Move window to workspace ──
    alt-shift-1 = 'move-node-to-workspace 1'
    alt-shift-2 = 'move-node-to-workspace 2'
    alt-shift-3 = 'move-node-to-workspace 3'
    alt-shift-4 = 'move-node-to-workspace 4'
    alt-shift-5 = 'move-node-to-workspace 5'
    alt-shift-6 = 'move-node-to-workspace 6'
    alt-shift-7 = 'move-node-to-workspace 7'
    alt-shift-8 = 'move-node-to-workspace 8'
    alt-shift-9 = 'move-node-to-workspace 9'
    alt-shift-a = 'move-node-to-workspace A'
    alt-shift-b = 'move-node-to-workspace B'
    alt-shift-c = 'move-node-to-workspace C'
    alt-shift-d = 'move-node-to-workspace D'
    alt-shift-e = 'move-node-to-workspace E'

    alt-shift-g = 'move-node-to-workspace G'
    alt-shift-i = 'move-node-to-workspace I'
    alt-shift-m = 'move-node-to-workspace M'
    alt-shift-n = 'move-node-to-workspace N'
    alt-shift-o = 'move-node-to-workspace O'
    alt-shift-p = 'move-node-to-workspace P'
    alt-shift-q = 'move-node-to-workspace Q'
    alt-shift-r = 'move-node-to-workspace R'
    alt-shift-s = 'move-node-to-workspace S'
    alt-shift-t = 'move-node-to-workspace T'
    alt-shift-u = 'move-node-to-workspace U'
    alt-shift-v = 'move-node-to-workspace V'
    alt-shift-w = 'move-node-to-workspace W'
    alt-shift-x = 'move-node-to-workspace X'
    alt-shift-y = 'move-node-to-workspace Y'
    alt-shift-z = 'move-node-to-workspace Z'

    # ── Workspace back-and-forth (like i3 mod-w) ──
    alt-tab = 'workspace-back-and-forth'

    # ── Move workspace to next/prev monitor ──
    alt-shift-tab = 'move-workspace-to-monitor --wrap-around next'

    # ── Service mode ──
    alt-shift-semicolon = 'mode service'

# ─────────────────────────────────────────────────────────────────
# SERVICE MODE (utilities)
# ─────────────────────────────────────────────────────────────────
[mode.service.binding]
    esc             = ['reload-config', 'mode main']
    r               = ['flatten-workspace-tree', 'mode main']    # reset layout
    f               = ['layout floating tiling', 'mode main']    # toggle float
    backspace       = ['close-all-windows-but-current', 'mode main']

    # Join containers (useful for nested stacked containers)
    alt-shift-h = ['join-with left',  'mode main']
    alt-shift-j = ['join-with down',  'mode main']
    alt-shift-k = ['join-with up',    'mode main']
    alt-shift-l = ['join-with right', 'mode main']
