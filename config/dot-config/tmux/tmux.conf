##### basics
set -g base-index 1
setw -g pane-base-index 1
set -g history-limit 10000
set -g mouse on
setw -g mode-keys vi

##### prefix
set -g prefix C-a
unbind C-b
bind-key C-a send-prefix

##### shell
set -g default-shell /bin/zsh

##### terminal / colors (clean truecolor)
set -g default-terminal "tmux-256color"
set -as terminal-features ',xterm-256color:RGB'
set -as terminal-features ',screen-256color:RGB'
set -as terminal-features ',tmux-256color:RGB'
set -g update-environment "DISPLAY SSH_ASKPASS SSH_AGENT_PID SSH_CONNECTION WINDOWID XAUTHORITY LANG LC_CTYPE"
set-environment -g LANG en_US.UTF-8
set-environment -g LC_CTYPE en_US.UTF-8

##### quality of life
set -g detach-on-destroy on
set -sg escape-time 10
set -g focus-events on

##### status bar (simple, readable)
set -g status-justify centre
set -g status-left '#[bold][ #S ]'
set -g status-right '#[bold][ %d/%m %H:%M ] #{prefix_highlight}'
set -g status-left-length 50
set -g status-right-length 50

##### key bindings
bind-key C-a last-window
bind r source-file ~/.config/tmux/tmux.conf \; display-message "Config reloaded!"

# split panes, keep cwd
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# vim-ish pane movement without prefix (alt + hjkl)
bind -n M-h select-pane -L
bind -n M-l select-pane -R
bind -n M-k select-pane -U
bind -n M-j select-pane -D

# switch windows using alt + number
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9

# sessionizer (your script)
bind-key -r f run-shell "tmux neww ~/.local/scripts/tmux-sessionizer"

# session switcher popup (ctrl+s)
bind-key -n C-s display-popup -E "tmux list-sessions | sed -E 's/:.*$//' | grep -v \"^$(tmux display-message -p '#S')\$\" | fzf --reverse | xargs tmux switch-client -t"

# kill pane
bind-key x kill-pane

# previous/next client (alt+[ and alt+])
bind -n M-[ switch-client -p
bind -n M-] switch-client -n

# mouse wheel -> tmux copy-mode scrollback (slow scroll)
bind -n WheelUpPane if-shell -F -t = "#{pane_in_mode}" "send-keys -X -N 1 scroll-up" "copy-mode -e; send-keys -X -N 1 scroll-up"
bind -n WheelDownPane if-shell -F -t = "#{pane_in_mode}" "send-keys -X -N 1 scroll-down" "send-keys -X -N 1 scroll-down"

##### plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'sainnhe/tmux-fzf'
set -g @plugin 'tmux-plugins/tmux-prefix-highlight'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# yank
set -g @yank_selection_mouse 'clipboard'

# persistence
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

# prefix highlight
set -g @prefix_highlight_show_copy_mode 'on'

##### theme hook
run-shell "~/.local/bin/tmux-apply-theme"
set-hook -g client-focus-in  'run-shell "~/.local/bin/tmux-apply-theme"'
set-hook -g after-new-session 'run-shell "~/.local/bin/tmux-apply-theme"'
set-hook -g after-new-window  'run-shell "~/.local/bin/tmux-apply-theme"'

# set -g extended-keys on`

##### TPM init (must be at bottom)
run '~/.tmux/plugins/tpm/tpm'
